name: KidsTubeTV preview release (signed APK, official FlClash)
on:
  push:
    branches:
      - "publish-preview/v0.3.0-beta.9"
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install Android SDK and NDK
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Prepare private signing or isolated fresh-install package
        env:
          KIDSTUBE_PREVIEW_KEYSTORE_BASE64: ${{ secrets.KIDSTUBE_PREVIEW_KEYSTORE_BASE64 }}
          KIDSTUBE_PREVIEW_STORE_PASSWORD: ${{ secrets.KIDSTUBE_PREVIEW_STORE_PASSWORD }}
          KIDSTUBE_PREVIEW_KEY_ALIAS: ${{ secrets.KIDSTUBE_PREVIEW_KEY_ALIAS }}
          KIDSTUBE_PREVIEW_KEY_PASSWORD: ${{ secrets.KIDSTUBE_PREVIEW_KEY_PASSWORD }}
          KIDSTUBE_PREVIEW_FALLBACK_SUFFIX: .preview.b9
        run: |
          bash -n scripts/prepare-preview-signing.sh
          bash scripts/prepare-preview-signing.sh
      - name: Build pinned official FlClash v0.9.3
        run: |
          bash -n scripts/build-official-flclash-core.sh
          bash scripts/build-official-flclash-core.sh
          mkdir -p app/libs
          cp dist/flclash-core/flclash-core-v0.9.3.aar app/libs/
      - name: Lint, JVM tests, build signed Debug APK
        env:
          KIDSTUBE_VERSION_NAME: 0.3.0-beta.9
          KIDSTUBE_VERSION_CODE: 11
          KIDSTUBE_PREVIEW_STORE_PASSWORD: ${{ secrets.KIDSTUBE_PREVIEW_STORE_PASSWORD }}
          KIDSTUBE_PREVIEW_KEY_ALIAS: ${{ secrets.KIDSTUBE_PREVIEW_KEY_ALIAS }}
          KIDSTUBE_PREVIEW_KEY_PASSWORD: ${{ secrets.KIDSTUBE_PREVIEW_KEY_PASSWORD }}
        run: |
          gradle --no-daemon -PkidsTubeOfficialCore=true :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Verify signature, package ID, min SDK, ABIs, zip alignment
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist/release
          "$BT/apksigner" verify --min-sdk-version 28 --verbose --print-certs "$APK" | tee dist/release/APK_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/release/APK_SIGNATURE.txt
          "$BT/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" "$RUNNER_TEMP/apk-badging.txt"
          EXPECTED_PACKAGE="dev.kidstubetv$KIDSTUBE_PREVIEW_PACKAGE_SUFFIX"
          grep -Fq "package: name='$EXPECTED_PACKAGE'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "sdkVersion:'28'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -Z -1 "$APK" > "$RUNNER_TEMP/apk-files.txt"
          for ABI in armeabi-v7a arm64-v8a; do
            grep -q "^lib/$ABI/" "$RUNNER_TEMP/apk-files.txt" || {
              echo "::error::Required $ABI native libraries missing from APK" >&2
              exit 1
            }
          done
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          NAME="KidsTubeTV-v0.3.0-beta.9-FlClash-INSTALLABLE.apk"
          cp "$APK" "dist/release/$NAME"
          cp dist/flclash-core/SOURCE-INFO.txt dist/release/FLCLASH-SOURCE-INFO.txt
          cp dist/flclash-core/FlClash-LICENSE dist/release/FlClash-LICENSE
          (cd dist/release && sha256sum "$NAME" > SHA256SUMS.txt)
          {
            echo "KidsTubeTV v0.3.0-beta.9"
            echo "APK: $NAME"
            echo "Application ID: $EXPECTED_PACKAGE"
            echo "Signing: $KIDSTUBE_PREVIEW_SIGNING_MODE"
            echo "Minimum Android: 9 (API 28)"
            echo "Native ABIs: armeabi-v7a, arm64-v8a"
            echo "APK SHA-256:"
            cat dist/release/SHA256SUMS.txt
            echo "Certificate:"
            grep '^Signer #1 certificate SHA-256 digest:' dist/release/APK_SIGNATURE.txt
            echo "A valid signature does not guarantee installability on an unsupported device."
          } > dist/release/APK_INSTALL_INFO.txt
          cat dist/release/APK_INSTALL_INFO.txt
      - name: Write honest installation and signing notes
        run: |
          cat > dist/release/RELEASE_NOTES.md <<'EOF'
          ## v0.3.0-beta.9 — signed Android TV + phone installation preview

          **CI verifies APK signing and its v2 signature.** See APK_SIGNATURE.txt,
          APK_INSTALL_INFO.txt, SHA256SUMS.txt and the successful workflow.

          Older beta builds used temporary Debug keystores on GitHub runners.
          Their certificates can differ, making Android reject in-place upgrades
          with "App not installed" / INSTALL_FAILED_UPDATE_INCOMPATIBLE.

          **This release uses a separate installable preview package** to avoid
          touching your existing dev.kidstubetv installation and settings.
          - Without private preview signing secrets: dev.kidstubetv.preview.b9,
            an Android Debug-signed test app. This is a fresh parallel install,
            NOT an in-place update, and not reusable for the next beta.
          - With private stable preview signing secrets: dev.kidstubetv.preview,
            signed with that private key and updatable by future builds using
            the exact same key, app ID and increasing versionCode.
          - NEVER commit a private signing key to this public repository.
          - The prior app's Clash settings and parental PIN are not copied.
          - Android supports only one active VPN service; stop the previous
            KidsTubeTV VPN before starting this test app.
          - Hardware verification remains necessary; native ARM libraries are
            packaged for armeabi-v7a and arm64-v8a, Android 9+.

          Additional release features: Clash URL copy/edit and safe download retry,
          responsive phone/TV interface, parental approval and network diagnostics.

          Troubleshooting: docs/INSTALL_AND_SIGNING.md.
          NOTE: CI verification is not a physical-device installation test.
          EOF
      - name: Publish signed APK prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-beta.9
          target_commitish: ${{ github.sha }}
          name: KidsTubeTV v0.3.0-beta.9 — installable signed phone/TV preview
          prerelease: true
          draft: false
          generate_release_notes: false
          body_path: dist/release/RELEASE_NOTES.md
          files: |
            dist/release/*.apk
            dist/release/SHA256SUMS.txt
            dist/release/APK_SIGNATURE.txt
            dist/release/APK_INSTALL_INFO.txt
            dist/release/FLCLASH-SOURCE-INFO.txt
            dist/release/FlClash-LICENSE
