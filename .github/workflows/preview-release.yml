name: KidsTubeTV preview release (libmihomo-android)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Pre-release version (without v prefix)'
        required: true
        default: '0.3.0-beta.10'
      version_code:
        description: 'Increasing Android versionCode'
        required: true
        default: '20'
      preview_suffix:
        description: 'Isolated package suffix when no private preview signer is configured'
        required: true
        default: '.preview.b10'
  # Allow a vetted version request committed directly to main to publish a
  # preview even when GitHub Actions workflow_dispatch is not API-accessible.
  push:
    branches: [main]
    paths:
      - '.github/release-requests/preview.txt'
permissions:
  contents: write
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: |
          SDK_MANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Validate preview version and prevent tag collision
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_PREVIEW_SUFFIX: ${{ inputs.preview_suffix }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            mapfile -t requested < .github/release-requests/preview.txt
            [[ "${#requested[@]}" == 3 ]] || {
              echo "::error::Preview request must contain exactly three lines."; exit 1;
            }
            VERSION_NAME="${requested[0]}"
            VERSION_CODE="${requested[1]}"
            PREVIEW_SUFFIX="${requested[2]}"
          else
            VERSION_NAME="$INPUT_VERSION_NAME"
            VERSION_CODE="$INPUT_VERSION_CODE"
            PREVIEW_SUFFIX="$INPUT_PREVIEW_SUFFIX"
          fi
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || exit 1
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$PREVIEW_SUFFIX" =~ ^\.preview\.b[1-9][0-9]*$ ]] || exit 1
          if git ls-remote --tags origin "refs/tags/v$VERSION_NAME" | grep -q .; then
            echo "::error::Release tag v$VERSION_NAME already exists; will not overwrite it."
            exit 1
          fi
          echo "KIDSTUBE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "KIDSTUBE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "KIDSTUBE_PREVIEW_FALLBACK_SUFFIX=$PREVIEW_SUFFIX" >> "$GITHUB_ENV"
      - name: Prepare preview signing or isolated debug package
        env:
          KIDSTUBE_PREVIEW_KEYSTORE_BASE64: ${{ secrets.KIDSTUBE_PREVIEW_KEYSTORE_BASE64 }}
          KIDSTUBE_PREVIEW_STORE_PASSWORD: ${{ secrets.KIDSTUBE_PREVIEW_STORE_PASSWORD }}
          KIDSTUBE_PREVIEW_KEY_ALIAS: ${{ secrets.KIDSTUBE_PREVIEW_KEY_ALIAS }}
          KIDSTUBE_PREVIEW_KEY_PASSWORD: ${{ secrets.KIDSTUBE_PREVIEW_KEY_PASSWORD }}
        run: bash scripts/prepare-preview-signing.sh
      - name: Download and verify pinned libmihomo AAR
        run: bash scripts/fetch-mihomo.sh
      - name: Lint, unit tests and signed preview APK
        env:
          KIDSTUBE_PREVIEW_STORE_PASSWORD: ${{ secrets.KIDSTUBE_PREVIEW_STORE_PASSWORD }}
          KIDSTUBE_PREVIEW_KEY_ALIAS: ${{ secrets.KIDSTUBE_PREVIEW_KEY_ALIAS }}
          KIDSTUBE_PREVIEW_KEY_PASSWORD: ${{ secrets.KIDSTUBE_PREVIEW_KEY_PASSWORD }}
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signature, min SDK, ABIs and alignment
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist/release
          "$BT/apksigner" verify --min-sdk-version 28 --verbose --print-certs "$APK" | tee dist/release/APK_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/release/APK_SIGNATURE.txt
          "$BT/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          EXPECTED_PACKAGE="dev.kidstubetv$KIDSTUBE_PREVIEW_PACKAGE_SUFFIX"
          grep -Fq "package: name='$EXPECTED_PACKAGE'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "sdkVersion:'28'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -Z -1 "$APK" > "$RUNNER_TEMP/apk-files.txt"
          for ABI in armeabi-v7a arm64-v8a; do
            grep -q "^lib/$ABI/" "$RUNNER_TEMP/apk-files.txt"
          done
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          NAME="KidsTubeTV-v${KIDSTUBE_VERSION_NAME}-libmihomo-android9.apk"
          cp "$APK" "dist/release/$NAME"
          cat > dist/release/LIBMIHOMO-SOURCE-INFO.txt <<'INFO'
          Upstream: https://github.com/oviron/libmihomo-android
          Artifact: libmihomo-android-v0.3.13.aar
          Version: v0.3.13
          SHA-256: c6c2787e5dd888a8f9193501506dfa3a4f8a38fbd51adefccf67d84d0c8e0fb5
          License: GPL-3.0 (review upstream dependencies before redistribution)
          INFO
          (cd dist/release && sha256sum "$NAME" > SHA256SUMS.txt)
          {
            echo "APK: $NAME"
            echo "Application ID: $EXPECTED_PACKAGE"
            echo "Signing: $KIDSTUBE_PREVIEW_SIGNING_MODE"
            echo "Minimum Android: 9 (API 28)"
            echo "ABIs: armeabi-v7a, arm64-v8a"
            cat dist/release/SHA256SUMS.txt
            grep '^Signer #1 certificate SHA-256 digest:' dist/release/APK_SIGNATURE.txt
          } > dist/release/APK_INSTALL_INFO.txt
      - name: Write preview release notes
        run: |
          cat > dist/release/RELEASE_NOTES.md <<'EOF'
          # KidsTubeTV v0.3.0-beta.10 · Android TV / phone preview

          This preview is built directly from the latest main branch with
          the pinned **oviron/libmihomo-android v0.3.13** core, not FlClash.

          ## What's new
          - Redesigned parent settings for TV remotes and phone touch controls:
            overview, app network, YouTube, child content and parent security.
          - Unified the Google device-code login, node selector and diagnostics pages.
          - Separate, privacy-protected subscription URL editor with clipboard helpers.
          - App-only Android VPN allowlist; other apps are not routed through this VPN.
          - Safer subscription update races, bounded YouTube HTTP responses,
            Google auth state checks and stale async callback handling.

          ## Installation
          - Supports Android 9+ (API 28); APK contains ARMv7 and ARM64 native libraries.
          - Check APK_INSTALL_INFO.txt for the precise package name and signing mode.
          - If private preview signing secrets are absent, this release uses a
            version-specific parallel install package rather than replacing the
            previous beta or a differently signed build.
          - Do not uninstall an older build until you've independently saved any
            configuration you need to keep; Android app data is not shared.

          ## Verification scope
          - CI verifies Lint, JVM unit tests, APK signature, ABI list, alignment
            and SHA-256. Real-device VPN, Google OAuth and YouTube IFrame playback
            have **not** been fully verified on the target TV/phone.
          - An Android device generally permits only one active VPN at a time;
            the app-only traffic rule does not make two concurrent VPNs possible.
          EOF
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KIDSTUBE_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: KidsTubeTV v${{ env.KIDSTUBE_VERSION_NAME }} — libmihomo preview
          prerelease: true
          draft: false
          body_path: dist/release/RELEASE_NOTES.md
          files: |
            dist/release/*.apk
            dist/release/SHA256SUMS.txt
            dist/release/APK_SIGNATURE.txt
            dist/release/APK_INSTALL_INFO.txt
            dist/release/LIBMIHOMO-SOURCE-INFO.txt
