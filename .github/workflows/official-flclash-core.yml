name: Build and statically check official FlClash core
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/official-flclash-core.yml"
      - "scripts/build-official-flclash-core.sh"
      - "app/src/official/**"
      - "app/src/main/java/dev/kidstubetv/proxy/**"
      - "app/build.gradle.kts"
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install SDK and Android NDK
        run: |
          SDK_MANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Check build script syntax
        run: bash -n scripts/build-official-flclash-core.sh
      - name: Build pinned FlClash v0.9.3 Go mobile AAR
        env:
          FLCLASH_TAG: v0.9.3
          NDK_VERSION: 28.2.13676358
        run: bash scripts/build-official-flclash-core.sh
      - name: Compile, lint and unit-test official core variant (no TV required)
        run: |
          mkdir -p app/libs
          cp dist/flclash-core/flclash-core-v0.9.3.aar app/libs/
          gradle --no-daemon -PkidsTubeOfficialCore=true \
            :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Verify AAR and official APK native binaries
        run: |
          unzip -Z -1 app/build/outputs/apk/debug/app-debug.apk | grep -E '^lib/(armeabi-v7a|arm64-v8a)/'
          unzip -Z -1 dist/flclash-core/flclash-core-v0.9.3.aar | grep -E '^(jni/|classes.jar)'
      - name: Upload core AAR, SHA256, license and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-official-source-built-core
          path: dist/flclash-core/*
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload official Android TV debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KidsTubeTV-official-FlClash-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
