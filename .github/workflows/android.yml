name: Android TV build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest has pre-installed Android SDK. Avoid setup-android v3
      # which tries installing deprecated 'tools' and fails on newer SDK repos.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: |
          SDK_MANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Download and verify pinned Mihomo AAR
        run: bash scripts/fetch-mihomo.sh
      - name: Test and compile
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KidsTubeTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
