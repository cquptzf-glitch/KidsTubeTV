name: Android TV + phone build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: |
          SDK_MANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Static syntax check
        run: bash -n scripts/fetch-mihomo.sh
      - name: Download and verify pinned libmihomo AAR
        run: bash scripts/fetch-mihomo.sh
      - name: Lint, test and compile
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK SDK and ABI
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          unzip -Z -1 "$APK" | grep '^lib/' | sort | head -60 || true
          for ABI in armeabi-v7a arm64-v8a; do
            unzip -Z -1 "$APK" | grep -q "^lib/$ABI/" || echo "::warning::Missing $ABI native library"
          done
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KidsTubeTV-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: KidsTubeTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
