name: Android TV build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK API 36
        run: sdkmanager "platforms;android-36"
      - name: Download pinned Mihomo AAR with SHA-256 check
        run: bash scripts/fetch-mihomo.sh
      - name: Unit tests + APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KidsTubeTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
